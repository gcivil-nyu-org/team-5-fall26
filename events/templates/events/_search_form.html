<form class="event-search" role="search" method="get"
      action="{% if search_action %}{{ search_action }}
      {% else %}{% url 'search' %}{% endif %}">
    <label class="search-label" for="event-search">Search events</label>
    <div class="search-controls">
        <span class="search-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" focusable="false">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.6-3.6"></path>
            </svg>
        </span>
        <input id="event-search" type="search" name="q" value="{{ query|default:'' }}" placeholder="{% if search_action %}Search by activity, park, or location{% else %}Try &ldquo;kids events in Brooklyn this weekend&rdquo;{% endif %}">
        <button type="submit">Search</button>
    </div>
    {% if not search_action %}
    {# Upcoming-event searches are read as plain language; this holds the words already on the page, so changing only the filters keeps them as they are. #}
    <input type="hidden" name="nl" value="{{ query|default:'' }}">
    {% endif %}
    {% include 'events/_filter_bar.html' with form=filter_form %}
</form>
