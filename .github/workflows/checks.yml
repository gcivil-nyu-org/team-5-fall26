name: Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check .

  flake8:
    name: Flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check lint
        run: python -m flake8

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: team5
      POSTGRES_USER: team5
      POSTGRES_PASSWORD: team5
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: team5
          POSTGRES_USER: team5
          POSTGRES_PASSWORD: team5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team5 -d team5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        id: tests
        run: python -m coverage run manage.py test
      - name: Report coverage and enforce 95% minimum
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python -m coverage report
