{% extends "base.html" %}

{% block title %}Reset your password{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p>Enter the email address you signed up with and we'll send you a link to choose a new password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="button primary">Send reset link</button>
  </form>
  <p><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
