{% extends "base.html" %}

{% block title %}Create an account{% endblock %}

{% block content %}
  <h1>Create an account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="button primary">Create account</button>
  </form>
  <p>Already have an account?</p>
  <a class="button" href="{{ login_url }}">Log in</a>
{% endblock %}
